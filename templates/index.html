<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <meta name="description" content="Aplicação de missões diárias de leitura">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ENS Daily">
    
    <title>Missão Diária</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icons/icon-192.svg" type="image/svg+xml">
</head>
<body>

    <h1>📘 Missão Diária</h1>

    <div id="streak">🔥 Streak: --</div>

    <!-- BOTÃO DE RESET PARA TESTES -->
    <div class="debug-controls">
        <button id="resetBtn" class="btn-reset">🔄 Reset (Testes)</button>
    </div>

    <!-- MAPA DE MISSÕES -->
    <div class="missions-map">
        <h3>Mapa de Missões</h3>
        <div id="missionsContainer" class="missions-grid">
            <!-- Gerado por JavaScript -->
        </div>
    </div>

    <!-- MISSÃO ATUAL -->
    <div id="mission" class="card">
        <h2 id="title">Carregando...</h2>
        <p id="preview"></p>

        <button id="readBtn">Ler texto</button>
        <button id="completeBtn">Concluir missão</button>
    </div>

    <!-- LEITURA COMPLETA -->
    <div id="reading" class="card hidden">
        <h2 id="readingTitle"></h2>
        <p id="content"></p>

        <button id="backBtn">Voltar</button>
    </div>

    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js"></script>

    <!-- PWA - Registrar Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    console.log('Service Worker registrado:', registration);
                })
                .catch(error => {
                    console.log('Erro ao registrar Service Worker:', error);
                });
        }
    </script>
</body>
</html>
